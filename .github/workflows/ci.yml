name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # Some upstream tests drive a real tmux server.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Test
        run: go test ./...
